# Production deploy (Engineering_Plan §B.14-B.15). Runs only for a push to main whose CI run
# passed. It deploys the exact commit CI checked to Cloudflare Pages, then moves the `prod`
# branch to that commit, so `prod` is always what is live. The two secrets are used by the
# deploy step only; nothing in the build can read them.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write # only to move the prod branch after a successful deploy

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://beautally.example' }}
  # Optional build-time switches. Leave the repository variables unset to keep them off.
  PUBLIC_ADS_ENABLED: ${{ vars.PUBLIC_ADS_ENABLED || 'false' }}
  PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
  PUBLIC_ADSENSE_SLOT_INARTICLE: ${{ vars.PUBLIC_ADSENSE_SLOT_INARTICLE }}
  PUBLIC_ADSENSE_SLOT_BOTTOM: ${{ vars.PUBLIC_ADSENSE_SLOT_BOTTOM }}
  PUBLIC_AFFILIATES_ENABLED: ${{ vars.PUBLIC_AFFILIATES_ENABLED || 'false' }}
  PUBLIC_ANALYTICS_ENABLED: ${{ vars.PUBLIC_ANALYTICS_ENABLED || 'false' }}
  PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
  PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    # A weekly scheduled CI run must not redeploy, and neither may a failed run.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check the Cloudflare secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (README: Deployment)."
            exit 1
          fi

      - name: Install (exact versions from the lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy dist --project-name=beautally --branch=prod

      # Fast-forward only: if prod has commits main does not, this fails instead of
      # overwriting them. Pushes made with the built-in token do not start other workflows.
      - name: Move the prod branch to the deployed commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: git push origin "$SHA:refs/heads/prod"
