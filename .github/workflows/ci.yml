# Continuous integration (Engineering_Plan §B.11-B.12). Stages run in this order and the run
# stops at the first failure. Node comes from .nvmrc and pnpm from "packageManager" in
# package.json, so the versions are pinned in one place each.
name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly, so a new advisory is noticed even when nobody pushes (TDD §D.33).
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The site address is public. Set the repository variable PUBLIC_SITE_URL for real builds.
  PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://beautally.example' }}

jobs:
  verify:
    name: Check, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (exact versions from the lockfile)
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm run format:check

      - name: Types
        run: pnpm run check

      - name: Unit tests with coverage
        run: pnpm run test:cov

      - name: Build
        run: pnpm run build

      - name: JavaScript size budget
        run: pnpm run size

      - name: SEO scan of dist
        run: pnpm run seo:check

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Install the browser for the E2E tests
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm exec playwright test

      - name: Keep the E2E results when a test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
